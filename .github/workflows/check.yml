# On every push and pull request: the tests of the study rules, the content validation, the build,
# a check of the built site (links, titles, descriptions, share images, one h1, JSON-LD),
# and the end-to-end tests of the study path and main pages in a real browser (e2e/, Playwright).
# Vercel deploys on its own; a red cross here means something is wrong before or after it goes live.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-site.mjs apps/web/dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
